<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Map Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#18212f; --mute:#5d6878; --rule:#cfd6e2; --grid:#dde3ed; --map:#f6f8fb;
  --accent:#1f5fd1; --accent-ink:#ffffff; --good:#14803c; --warn:#a86500; --bad:#c62828; --node:#ffffff; --nodeline:#18212f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1520; --panel:#15202e; --ink:#e8edf5; --mute:#97a3b4; --rule:#2a3a4d; --grid:#1c2a3b; --map:#101b29;
  --accent:#6ea0ff; --accent-ink:#0d1520; --good:#5fd08a; --warn:#f0b24a; --bad:#ff7a7a; --node:#15202e; --nodeline:#e8edf5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1520; --panel:#15202e; --ink:#e8edf5; --mute:#97a3b4; --rule:#2a3a4d; --grid:#1c2a3b; --map:#101b29;
  --accent:#6ea0ff; --accent-ink:#0d1520; --good:#5fd08a; --warn:#f0b24a; --bad:#ff7a7a; --node:#15202e; --nodeline:#e8edf5; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:3px solid var(--accent)}
h1{margin:0;font:700 22px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.nameIn{flex:1;min-width:140px;max-width:300px;padding:6px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--bg)}
.search{flex:none;width:100%;padding:6px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--bg)}
.hgrp{display:flex;gap:6px;margin-left:auto}
.btn{padding:6px 11px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 360px}
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--map);overflow:hidden}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.drawbar{position:absolute;left:10px;top:54px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 70px);padding:6px 8px;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
.drawbar[hidden]{display:none}
.drawbar .xf{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:560px){.drawbar{top:96px}}
.drawbar select{padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);max-width:150px}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:36px;height:36px;padding:0;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.zoom .btn:disabled{opacity:.4}
.status{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;font-size:12px;color:var(--mute)}
.hint{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:5px 9px;max-width:min(520px,70%)}
.scale{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left}
.scale i{display:block;height:6px;border:2px solid var(--ink);border-top:0}
aside{min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--rule)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;padding:9px 4px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;font:600 14px var(--body);color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;min-height:0;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px 14px;display:flex;flex-direction:column;gap:12px}
.pane[hidden]{display:none}
h2{margin:0;font:700 14px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.f input,label.f select{padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);font-size:14px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.card{border:1px solid var(--rule);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.list{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;background:transparent;width:100%;text-align:left}
.item[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.35);flex:none}
.sw{width:26px;height:6px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.3)}
.mu{color:var(--mute);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--rule);border-radius:99px;font-size:12px}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--rule);border-radius:6px;background:none;cursor:pointer}
.ord{display:flex;align-items:center;gap:4px;padding:2px 0;font-size:13px}
.ord span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord .btn{padding:0 6px;line-height:20px}
.iss{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;font-size:13px}
.iss.e{border-color:var(--bad)} .iss.w{border-color:var(--warn)}
.iss em{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;flex:none;width:44px}
.iss.e em{color:var(--bad)} .iss.w em{color:var(--warn)}
.ok{color:var(--good);font-weight:600}
textarea{width:100%;min-height:130px;padding:8px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.msg{font-size:12px;color:var(--mute);min-height:16px}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:50;padding:16px}
.mbox{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:16px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.mbox p{margin:0}.mrow{display:flex;gap:8px;flex-wrap:wrap}
.savest{font-size:12px;color:var(--mute);min-width:0}.savest.err{color:var(--bad)}
.rob{flex:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--rule)}
.rob[hidden]{display:none}
.lib{height:100%;overflow:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.lib[hidden],.app[hidden]{display:none}
.lib-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lib h1{font-size:38px}
.lib .btn{padding:8px 14px}
.chip.on{border-color:var(--accent);color:var(--ink)}
.ro .tools,.ro .drawbar,.ro #undo,.ro #redo{display:none}
.meter{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}.meter i.hi{background:var(--warn)}.meter i.full{background:var(--bad)}
.linkbox{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);font:12px ui-monospace,Menlo,Consolas,monospace}
.mbox label.chk{display:flex;gap:8px;align-items:flex-start}
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(300px,55%) 1fr}
  aside{border-left:0;border-top:1px solid var(--rule)}
  .hint{display:none}
}
</style>
</head><body>
<div class="lib" id="lib"><div class="lib-in" id="libin"></div></div>
<div class="app" id="ed" hidden>
<header>
  <button class="btn sm" id="tolib" type="button">&larr; My maps</button>
  <h1>Map Editor</h1>
  <input class="nameIn" id="mapname" aria-label="Map name" placeholder="Map name" maxlength="60">
  <span class="savest" id="savest" role="status" aria-live="polite"></span>
  <div class="hgrp"><button class="btn sm" id="signin" type="button" hidden>Sign in to save</button><button class="btn sm" id="sharebtn" type="button">Share</button><button class="btn sm" id="copybtn" type="button">Save a copy</button></div>
</header>
<div class="rob" id="rob" hidden></div>
<div class="main" id="edmain">
  <div class="mapwrap">
    <svg id="map" role="img" aria-label="Map canvas"></svg>
    <div class="tools" id="tools">
      <button class="btn" data-t="station">Add station</button>
      <button class="btn" data-t="addline">Add line</button>
      <button class="btn" data-t="editline">Edit line</button>
      <button class="btn" data-t="bg">Move image</button>
    </div>
    <div class="drawbar" id="drawbar" hidden></div>
    <div class="zoom"><button class="btn" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button class="btn" id="redo" aria-label="Redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button><button class="btn" id="zi" aria-label="Zoom in">+</button><button class="btn" id="zo" aria-label="Zoom out">−</button><button class="btn" id="fit" style="width:auto;font-size:12px;padding:0 8px">Fit</button></div>
    <div class="status"><div class="hint" id="hint"></div><div class="scale"><span id="coord"></span><span id="scl">1 km</span><i id="scb"></i></div></div>
  </div>
  <aside>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-p="st" aria-selected="true">Stations</button>
      <button role="tab" data-p="ln" aria-selected="false">Lines</button>
      <button role="tab" data-p="ck" aria-selected="false" id="cktab">Check</button>
      <button role="tab" data-p="mp" aria-selected="false">Map &amp; data</button>
    </div>
    <div class="pane" id="p-st"></div>
    <div class="pane" id="p-ln" hidden></div>
    <div class="pane" id="p-ck" hidden></div>
    <div class="pane" id="p-mp" hidden></div>
  </aside>
</div>
</div>
<script>
(function(){
"use strict";
var BUILTINS=/*__BUILTINS__*/{};
var NS='http://www.w3.org/2000/svg',svg=document.getElementById('map');
var KM=111.32,PALETTE=['#d32f2f','#1565c0','#2e7d32','#ef6c00','#6a1b9a','#00838f','#ad1457','#5d4037','#455a64','#9e9d24'];
var CUR={id:null,owner:null,ownerName:'',share:'private',ro:false,dirty:false,nameEdited:false,from:null},dm='extend',tg={b:null,e:'end'},addId=null,segDrag=null,touched=false,S,hist=[],fut=[],tool='select',tab='st',selSt=null,selLn=null,vb=null,bg=null,hover=null,issuesCache=[];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}

/* ---------- model ---------- */
function blank(){return {name:'New map',lat0:45.5,lon0:-73.57,st:[],ln:[],sq:1,lq:1}}
function example(){
  var s=blank();s.name='Example City';
  var P=[['Harbour',-73.62,45.47],['Old Town',-73.60,45.49],['Central',-73.57,45.50],['Market',-73.54,45.51],['Airport',-73.50,45.53],['University',-73.58,45.53],['Hillside',-73.59,45.56],['Riverside',-73.64,45.51],['Stadium',-73.53,45.47],['Junction',-73.60,45.51]];
  P.forEach(function(p){s.st.push({id:'s'+s.sq++,name:p[0],lon:p[1],lat:p[2]})});
  function id(n){return s.st.filter(function(x){return x.name===n})[0].id}
  s.ln.push({id:'l'+s.lq++,name:'Red Line',color:'#d32f2f',rail:true,order:['Harbour','Old Town','Central','Market','Airport'].map(id)});
  s.ln.push({id:'l'+s.lq++,name:'Blue Line',color:'#1565c0',rail:true,order:['Riverside','Junction','Central','Stadium'].map(id)});
  s.ln.push({id:'l'+s.lq++,name:'Bus 12',color:'#2e7d32',rail:false,order:['Junction','University','Hillside'].map(id)});
  return s}
function fromData(d){
  var s=blank();if(d.name)s.name=String(d.name).slice(0,60);
  if(d.center&&isFinite(d.center.lat)&&isFinite(d.center.lon)){s.lat0=+d.center.lat;s.lon0=+d.center.lon}
  var map={},regs=d.regions||[],lines=d.lines||[];
  regs.forEach(function(r){var c=r.c||[];if(!isFinite(c[0])||!isFinite(c[1]))return;var id='s'+s.sq++;map[r.id]=id;s.st.push({id:id,name:String(r.name||r.id),lon:+c[0],lat:+c[1]})});
  lines.forEach(function(l,i){s.ln.push({id:'l'+s.lq++,name:String(l.name||l.id),color:/^#[0-9a-f]{6}$/i.test(l.color||'')?l.color:PALETTE[i%PALETTE.length],rail:l.rail!==false,order:(l.order||[]).map(function(x){return map[x]}).filter(Boolean)});var nl=s.ln[s.ln.length-1];var brs=(l.branches||[]).map(function(b){return {id:(function(){s.bq=s.bq||1;return 'b'+s.bq++})(),order:((b&&b.order)||[]).map(function(x){return map[x]}).filter(Boolean)}}).filter(function(b){return b.order.length>=2});if(brs.length)nl.branches=brs});
  if(!d.center&&s.st.length){var la=0,lo=0;s.st.forEach(function(x){la+=x.lat;lo+=x.lon});s.lat0=la/s.st.length;s.lon0=lo/s.st.length}
  return s}
function slug(n){var t=String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');return t||'x'}
function uniq(base,used){var id=base,i=2;while(used[id])id=base+'-'+(i++);used[id]=1;return id}
function toData(){
  var used={},sid={};S.st.forEach(function(x){sid[x.id]=uniq(slug(x.name),used)});
  var lu={},lid={};S.ln.forEach(function(l){lid[l.id]=uniq(slug(l.name),lu)});
  var regs=S.st.map(function(x){return {id:sid[x.id],name:x.name,c:[+x.lon.toFixed(5),+x.lat.toFixed(5)],lines:S.ln.filter(function(l){return onLine(l,x.id)}).map(function(l){return lid[l.id]}),pt:1}});
  var lines=S.ln.map(function(l){var o={id:lid[l.id],name:l.name,color:l.color,order:l.order.map(function(i){return sid[i]}),rail:l.rail};if(l.branches&&l.branches.length)o.branches=l.branches.map(function(b){return {order:b.order.map(function(i){return sid[i]})}});return o});
  return {format:'rail-rush-map',version:1,name:S.name,center:{lat:+S.lat0.toFixed(5),lon:+S.lon0.toFixed(5)},regions:regs,lines:lines}}
function stById(id){for(var i=0;i<S.st.length;i++)if(S.st[i].id===id)return S.st[i];return null}
function lnById(id){for(var i=0;i<S.ln.length;i++)if(S.ln[i].id===id)return S.ln[i];return null}
function runs(l){return [l.order].concat((l.branches||[]).map(function(b){return b.order}))}
function onLine(l,sid){return runs(l).some(function(r){return r.indexOf(sid)>=0})}
function linesOf(sid){return S.ln.filter(function(l){return onLine(l,sid)})}
function newBranchId(){S.bq=S.bq||1;return 'b'+S.bq++}
function brById(l,id){var bs=l&&l.branches||[];for(var i=0;i<bs.length;i++)if(bs[i].id===id)return bs[i];return null}
/* the run (trunk or one branch) that Edit line is currently extending */
function curRun(l){var b=tg.b&&brById(l,tg.b);return b?{order:b.order,br:b,front:false}:{order:l.order,br:null,front:tg.e==='start'}}
function isTarget(l,b){return tool==='line'&&dm==='extend'&&selLn===l.id&&tg.b===b.id}
function cleanBranches(){var ch=false;S.ln.forEach(function(l){if(!l.branches)return;var n=l.branches.length;l.branches=l.branches.filter(function(b){return b.order.length>=2||isTarget(l,b)});if(l.branches.length!==n)ch=true});if(ch)save();return ch}

/* ---------- history + storage ---------- */
function snap(){return JSON.stringify(S)}
function save(){try{if(!CUR.id&&!CUR.ro)localStorage.setItem('tg-map-draft',snap())}catch(e){}scheduleCloud()}
function push(pre){CUR.dirty=true;hist.push(pre||snap());if(hist.length>150)hist.shift();fut=[]}
function building(l){return tool==='line'&&dm==='new'&&l.id===addId}
function prune(){var gone=S.ln.filter(function(l){return l.order.length<2&&!building(l)});
  if(cleanBranches())pruneMsg='A branch with no station beyond its fork was deleted.';
  if(!gone.length)return false;S.ln=S.ln.filter(function(l){return gone.indexOf(l)<0});
  if(selLn&&!lnById(selLn))selLn=null;if(addId&&!lnById(addId))addId=null;
  pruneMsg=gone.length===1?'Line "'+gone[0].name+'" was deleted because it had only one station.':gone.length+' lines with only one station were deleted.';return true}
var pruneMsg='';
function dropBuilding(){var l=addId&&lnById(addId);if(l&&l.order.length<2){S.ln=S.ln.filter(function(x){return x!==l});if(selLn===l.id)selLn=null;save()}}
/* Removing a station that joins a branch to the main line: ask which neighbouring station the branch should join instead. */
function forkCases(sid,lineId){var out=[];S.ln.forEach(function(l){if(lineId&&l.id!==lineId)return;var i=l.order.indexOf(sid);if(i<0||l.order.length<=2)return;
  (l.branches||[]).forEach(function(b){if(b.order[0]===sid)out.push({l:l,b:b,pv:i>0?l.order[i-1]:null,nx:i<l.order.length-1?l.order[i+1]:null})})});return out}
function askFork(c,i,n,cb){
  var sn=function(id){var s=stById(id);return s?s.name:'?'},prev=document.activeElement,second=c.b.order[1];
  var ov=document.createElement('div');ov.className='modal';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Reconnect branch');
  ov.innerHTML='<div class="mbox"><h2>Reconnect a branch</h2><p>\u201c'+esc(sn(c.b.order[0]))+'\u201d is where a branch of \u201c'+esc(c.l.name)+'\u201d'+(second?' (towards \u201c'+esc(sn(second))+'\u201d)':'')+' joins the line. Which neighbouring station should the branch join instead?</p>'+(n>1?'<div class="mu">Branch '+(i+1)+' of '+n+'</div>':'')+
    '<div class="mrow">'+(c.pv?'<button class="btn pri" data-v="p">Join at '+esc(sn(c.pv))+'</button>':'')+(c.nx?'<button class="btn pri" data-v="n">Join at '+esc(sn(c.nx))+'</button>':'')+'<button class="btn" data-v="d">Delete the branch</button><button class="btn" data-v="c">Cancel</button></div></div>';

/* ---------- accounts, saving, library, sharing ---------- */
var MAXB=900000,DBR=null,ME=null,saveT=null,MY=[],libOff=null;
function acct(){try{var A=window.parent&&window.parent.TGAuth,i=A&&A.info&&A.info();return i||{guest:false,name:''}}catch(e){return {guest:false,name:''}}}
function canSave(){return !!(DBR&&ME&&!acct().guest)}
function bytes(s){try{return new TextEncoder().encode(s).length}catch(e){return s.length}}
function kb(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(n<10240?1:0)+' KB':(n/1048576).toFixed(2)+' MB'}
function mapJson(){return JSON.stringify(toData())}
function newId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function dstr(ms){return new Date(ms||0).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function setStatus(txt,err){var e=$('savest');e.textContent=txt;e.className='savest'+(err?' err':'')}
function modal(html,wire){return new Promise(function(res){
  var ov=document.createElement('div');ov.className='modal';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.innerHTML='<div class="mbox">'+html+'</div>';
  var prev=document.activeElement;
  function done(v){document.removeEventListener('keydown',k,true);ov.remove();try{prev&&prev.focus&&prev.focus()}catch(e){}res(v)}
  function k(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(null)}}
  document.addEventListener('keydown',k,true);document.body.appendChild(ov);wire(ov.firstChild,done);var f=ov.querySelector('button,input');if(f)f.focus()})}
function notice(title,text){return modal('<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="mrow"><button class="btn pri" data-ok type="button">OK</button></div>',function(r,done){r.querySelector('[data-ok]').onclick=function(){done(true)}})}
function openSignIn(){try{window.parent.document.getElementById('acct').click()}catch(e){}}
function needAccount(){return modal('<h2>Sign in to save maps</h2><p>Maps are saved to your account so you can find them again and share them. You are using a guest profile right now. Your work stays in this browser until you sign in or create an account.</p><div class="mrow"><button class="btn pri" data-go type="button">Sign in or create account</button><button class="btn" data-no type="button">Not now</button></div>',
  function(r,done){r.querySelector('[data-go]').onclick=function(){done(true);openSignIn()};r.querySelector('[data-no]').onclick=function(){done(null)}})}
function statusIdle(){
  if(CUR.ro){setStatus('');return}
  if(!DBR||!ME)setStatus('Not connected. Changes stay in this browser.');
  else if(acct().guest)setStatus('Draft in this browser only.');
  else if(CUR.id)setStatus('Saved to your maps.');
  else setStatus('Saves to your maps on your first change.')}
function scheduleCloud(){
  if(CUR.ro||!canSave()||!(CUR.id||CUR.dirty||CUR.nameEdited))return;
  setStatus('Saving…');clearTimeout(saveT);saveT=setTimeout(cloudSave,1200)}
async function cloudSave(){
  clearTimeout(saveT);saveT=null;
  if(CUR.ro||!canSave())return false;
  var json=mapJson(),b=bytes(json);
  if(b>MAXB){setStatus('Too large to save ('+kb(b)+' of '+kb(MAXB)+'). Remove some stations.',true);return false}
  var now=Date.now(),creating=!CUR.id;if(creating)CUR.id=newId();
  var d={owner:ME,ownerName:acct().name||'',name:S.name||'Untitled map',json:json,st:S.st.length,ln:S.ln.length,share:CUR.share||'private',updatedAt:now};
  if(creating){d.createdAt=now;if(CUR.from)d.copiedFrom=CUR.from}
  try{await DBR.doc('maps/'+CUR.id).set(d,{merge:true});CUR.owner=ME;
    if(creating){try{localStorage.removeItem('tg-map-draft')}catch(e){}}
    setStatus('Saved '+new Date(now).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.');applyModeUI();return true}
  catch(e){console.error(e);if(creating)CUR.id=null;setStatus('Could not save. Will try again.',true);clearTimeout(saveT);saveT=setTimeout(cloudSave,10000);return false}}
async function flush(){if(saveT)await cloudSave()}

function applyModeUI(){
  var ed=$('ed');ed.classList.toggle('ro',!!CUR.ro);
  $('mapname').readOnly=!!CUR.ro;
  $('sharebtn').hidden=!!CUR.ro;
  $('signin').hidden=!(DBR&&ME&&acct().guest&&!CUR.ro);
  $('copybtn').textContent=CUR.ro?'Save a copy':'Duplicate';
  var rb=$('rob');
  if(CUR.ro){rb.hidden=false;rb.innerHTML='<span>You are viewing '+(CUR.ownerName?'<b>'+esc(CUR.ownerName)+'</b>’s':'a shared')+' map. It is view-only. Save a copy to edit your own.</span><button class="btn sm pri" id="rob-copy" type="button">Save a copy</button>';$('rob-copy').onclick=makeCopy}
  else{rb.hidden=true;rb.innerHTML=''}
  statusIdle()}
function showEditor(){$('lib').hidden=true;$('ed').hidden=false}
function showLib(){$('ed').hidden=true;$('lib').hidden=false;renderLib()}
function openDoc(s,cur){
  S=s;CUR=Object.assign({id:null,owner:null,ownerName:'',share:'private',ro:false,dirty:false,nameEdited:false,from:null},cur||{});
  hist=[];fut=[];selSt=null;selLn=S.ln.length?S.ln[0].id:null;bg=null;tool='select';tg={b:null,e:'end'};addId=null;segDrag=null;touched=false;stFilter='';tab='st';
  showEditor();applyModeUI();setTool('select');showTab();renderAll();fitStations()}
function builtin(k){var d=BUILTINS[k];if(!d)return null;var s=fromData(d);return s}
function newFrom(kind){
  var s,from=null;
  if(kind==='blank')s=blank();else if(kind==='example')s=example();
  else{s=builtin(kind);if(!s)return;s.name=(BUILTINS[kind].name||kind)+' (my copy)';from='builtin:'+kind}
  openDoc(s,{from:from})}
async function openMap(id){
  var bad='That map does not exist, or its owner has not shared it with you.';
  if(!DBR){await notice('Not connected','Maps cannot be opened right now.');return false}
  var snap;try{snap=await DBR.doc('maps/'+id).get()}catch(e){console.error(e);await notice('Cannot open map',bad);return false}
  if(!snap.exists){await notice('Cannot open map',bad);return false}
  var d=snap.data(),s;try{s=fromData(JSON.parse(d.json))}catch(e){await notice('Cannot open map','This map could not be read.');return false}
  s.name=d.name||s.name;
  openDoc(s,{id:id,owner:d.owner,ownerName:d.ownerName||'',share:d.share||'private',ro:d.owner!==ME,from:d.copiedFrom||null});return true}
async function makeCopy(){
  if(!canSave()){await needAccount();return}
  await flush();
  var s=fromData(JSON.parse(mapJson()));s.name=(S.name||'Map')+' (copy)';
  var from=CUR.id||CUR.from;
  openDoc(s,{from:from,dirty:true});
  if(await cloudSave())setStatus('Saved a copy to your maps. You can edit it.')}
async function dupMap(id){
  var m=MY.filter(function(x){return x.id===id})[0];if(!m)return;
  var s;try{s=fromData(JSON.parse(m.json))}catch(e){return}
  s.name=(m.name||'Map')+' (copy)';openDoc(s,{from:id,dirty:true});await cloudSave()}
function shareUrl(id){try{var L=window.parent.location;return L.origin+L.pathname+'#map='+id}catch(e){return '#map='+id}}
async function shareDlg(){
  if(CUR.ro)return;
  if(!canSave()){await needAccount();return}
  if(!CUR.id){CUR.dirty=true;if(!(await cloudSave()))return}
  var id=CUR.id;
  await modal('<h2>Share this map</h2><label class="chk"><input type="checkbox" id="sh-on"'+(CUR.share==='link'?' checked':'')+'><span>Anyone with the link can view this map and save their own copy. Only you can change it.</span></label>'+
    '<div id="sh-box"></div><div class="mu" id="sh-msg">Maps are private until you turn this on.</div><div class="mrow"><button class="btn" data-x type="button">Done</button></div>',
    function(r,done){
      function paint(){var on=CUR.share==='link';r.querySelector('#sh-box').innerHTML=on?'<input class="linkbox" id="sh-url" readonly aria-label="Share link" value="'+esc(shareUrl(id))+'"><div class="mrow" style="margin-top:6px"><button class="btn pri" id="sh-copy" type="button">Copy link</button></div>':'';
        if(on)r.querySelector('#sh-copy').onclick=function(){var u=r.querySelector('#sh-url'),m=r.querySelector('#sh-msg');
          function fb(){u.focus();u.select();m.textContent='Press Ctrl/Cmd+C to copy (selected).'}
          try{navigator.clipboard.writeText(u.value).then(function(){m.textContent='Link copied.'},fb)}catch(e){fb()}}}
      paint();
      r.querySelector('#sh-on').onchange=async function(){var on=this.checked,m=r.querySelector('#sh-msg');this.disabled=true;
        try{await DBR.doc('maps/'+id).set({share:on?'link':'private',updatedAt:Date.now()},{merge:true});CUR.share=on?'link':'private';m.textContent=on?'Sharing is on.':'Sharing is off. The link no longer works.'}
        catch(e){console.error(e);this.checked=!on;m.textContent='Could not change sharing. Try again.'}
        this.disabled=false;paint()};
      r.querySelector('[data-x]').onclick=function(){done(true)}})}

function renderLib(){
  var el=$('libin'),h='<h1>Map Editor</h1><p class="mu">Build maps for Rail Rush. Your maps are private until you share a link.</p>';
  h+='<h2>Start a map</h2><div class="row"><button class="btn pri" data-new="blank" type="button">Blank map</button><button class="btn" data-new="example" type="button">Example city</button></div>';
  var bk=Object.keys(BUILTINS);
  if(bk.length)h+='<h2>Edit a city</h2><div class="mu">Opens your own copy to edit. The original city is never changed.</div><div class="row">'+bk.map(function(k){return '<button class="btn" data-new="'+esc(k)+'" type="button">'+esc(BUILTINS[k].name||k)+'</button>'}).join('')+'</div>';
  var dr=null;try{var raw=localStorage.getItem('tg-map-draft');if(raw){dr=JSON.parse(raw);if(!dr||!Array.isArray(dr.st)||!Array.isArray(dr.ln))dr=null}}catch(e){dr=null}
  if(dr)h+='<h2>Unsaved draft</h2><div class="card"><div class="row"><b style="flex:1">'+esc(dr.name||'Untitled')+'</b><span class="chip">Draft in this browser</span></div><div class="mu">'+dr.st.length+' stations · '+dr.ln.length+' lines</div><div class="row"><button class="btn" data-draft="open" type="button">Continue</button><button class="btn" data-draft="del" type="button">Discard</button></div></div>';
  h+='<h2>My maps</h2>';
  if(!DBR||!ME)h+='<div class="mu">Not connected, so saved maps cannot be shown.</div>';
  else if(acct().guest)h+='<div class="mu">Sign in to save maps and find them here.</div><div class="row"><button class="btn pri" data-signin type="button">Sign in or create account</button></div>';
  else if(!MY.length)h+='<div class="mu">No saved maps yet. Start one above; it saves to your account when you make your first change.</div>';
  else h+=MY.slice().sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0)}).map(function(m){
    return '<div class="card" data-m="'+esc(m.id)+'"><div class="row"><b style="flex:1;min-width:0;overflow-wrap:anywhere">'+esc(m.name||'Untitled map')+'</b><span class="chip'+(m.share==='link'?' on':'')+'">'+(m.share==='link'?'Shared by link':'Private')+'</span></div>'+
      '<div class="mu">'+(m.st||0)+' stations · '+(m.ln||0)+' lines · edited '+esc(dstr(m.updatedAt))+'</div><div class="row"><button class="btn pri" data-a="open" type="button">Open</button><button class="btn" data-a="dup" type="button">Duplicate</button><button class="btn" data-a="del" type="button">Delete</button></div></div>'}).join('');
  h+='<h2>Open a shared map</h2><form class="row" id="lib-open"><input class="nameIn" style="max-width:none;flex:1" id="lib-link" placeholder="Paste a map link" aria-label="Map link"><button class="btn" type="submit">Open</button></form><div class="mu" id="lib-msg"></div>';
  el.innerHTML=h}
$('libin').addEventListener('click',async function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.new){newFrom(b.dataset.new);return}
  if(b.hasAttribute('data-signin')){openSignIn();return}
  if(b.dataset.draft==='open'){try{var d=JSON.parse(localStorage.getItem('tg-map-draft'));openDoc(d,{dirty:true})}catch(x){}return}
  if(b.dataset.draft==='del'){try{localStorage.removeItem('tg-map-draft')}catch(x){}renderLib();return}
  var card=b.closest('[data-m]');if(!card)return;var id=card.dataset.m,m=MY.filter(function(x){return x.id===id})[0];
  if(b.dataset.a==='open')await openMap(id);
  else if(b.dataset.a==='dup')await dupMap(id);
  else if(b.dataset.a==='del'&&m){
    var yes=await modal('<h2>Delete this map?</h2><p>“'+esc(m.name||'Untitled map')+'” will be deleted for good, and its share link will stop working. Games already started from it keep their own copy.</p><div class="mrow"><button class="btn pri" data-y type="button">Delete</button><button class="btn" data-n type="button">Cancel</button></div>',
      function(r,done){r.querySelector('[data-y]').onclick=function(){done(true)};r.querySelector('[data-n]').onclick=function(){done(null)}});
    if(yes){try{await DBR.doc('maps/'+id).delete()}catch(x){console.error(x);await notice('Could not delete','Try again in a moment.')}}}});
$('libin').addEventListener('submit',async function(e){e.preventDefault();
  var v=($('lib-link').value||'').trim(),m=/(?:#|[?&])map=([A-Za-z0-9_-]{3,60})/.exec(v)||/^([A-Za-z0-9_-]{3,60})$/.exec(v);
  if(!m){$('lib-msg').textContent='That does not look like a map link.';return}
  await openMap(m[1])});
$('tolib').onclick=async function(){await flush();showLib()};
$('sharebtn').onclick=shareDlg;$('copybtn').onclick=makeCopy;$('signin').onclick=openSignIn;
window.addEventListener('beforeunload',function(){try{if(saveT)cloudSave()}catch(e){}});

/* ---------- boot ---------- */
(function(){
  S=blank();selLn=null;
  function ready(){if(!svg.clientWidth)return;if(!touched){if(vb)fitStations()}else if(vb){renderCanvas()}}
  if(window.ResizeObserver)new ResizeObserver(ready).observe(svg);else window.addEventListener('resize',ready);
  showLib();
  (async function(){
    try{if(typeof claude!=='undefined'){DBR=await claude.use('db');var u=await claude.use('user');ME=u?await u.id():null}}catch(e){console.error(e);DBR=null;ME=null}
    if(DBR&&ME&&!acct().guest){
      try{libOff=DBR.collection('maps').where('owner','==',ME).onSnapshot(function(q){MY=q.docs.map(function(d){var o=d.data();o.id=d.id;return o});if(!$('lib').hidden)renderLib()},function(e){console.error(e)})}catch(e){console.error(e)}}
    var id=String(window.TG_GID||'').trim();
    if(/^[A-Za-z0-9_-]{3,60}$/.test(id)&&DBR){if(!(await openMap(id)))showLib()}
    else renderLib()})();
})();
})();
</script>
</body></html>
